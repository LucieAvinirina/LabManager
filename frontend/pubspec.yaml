name: frontend
description: "LabManager - Application de gestion de laboratoire informatique"
publish_to: 'none'
version: 1.0.0+1
 
environment:
  sdk: ^3.11.5
 
dependencies:
  flutter:
    sdk: flutter
 
  # ─── Navigation ───────────────────────────────────────────
  go_router: ^14.0.0
 
  # ─── Gestion d'état ───────────────────────────────────────
  provider: ^6.1.2
 
  # ─── Requêtes HTTP vers l'API Node.js ─────────────────────
  dio: ^5.4.3+1
 
  # ─── Stockage local (token JWT) ───────────────────────────
  shared_preferences: ^2.2.3
  flutter_secure_storage: ^9.0.0
 
  # ─── Firebase (notifications push) ────────────────────────
  firebase_core: ^3.1.0
  firebase_messaging: ^15.0.1
 
  # ─── Interface utilisateur ────────────────────────────────
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
 
  # ─── Calendrier pour les réservations ─────────────────────
  table_calendar: ^3.1.1
 
  # ─── Notifications locales ────────────────────────────────
  flutter_local_notifications: ^17.1.2
 
  # ─── Sélecteur d'images (photos incidents) ────────────────
  image_picker: ^1.1.2
 
  # ─── Utilitaires ──────────────────────────────────────────
  intl: ^0.20.2
 
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
 
flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/